name: Publish to PyPI

on:
  workflow_call:
    inputs:
      version:
        description: "Version being released (used to check out the release tag)."
        required: false
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. 0.1.3 (checks out tag v0.1.3)."
        required: false
        type: string

permissions:
  id-token: write

jobs:
  build-and-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: PyPi
      url: https://pypi.org/p/intent-drift
    steps:
      - uses: actions/checkout@v4
        with:
          # See publish-test.yml: checkout must target the tag the release
          # job just pushed, not the commit that triggered the run.
          ref: ${{ inputs.version && format('v{0}', inputs.version) || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Build distributions
        run: python -m build

      - name: Verify distributions
        run: twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
