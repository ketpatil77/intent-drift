name: Publish to TestPyPI

on:
  workflow_call:
    inputs:
      version:
        description: "Version being released (used to check out the release tag)."
        required: false
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. 0.1.3 (checks out tag v0.1.3)."
        required: false
        type: string

permissions:
  id-token: write

jobs:
  publish-test:
    name: Build and publish to TestPyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi-test
      url: https://test.pypi.org/p/intent-drift
    steps:
      - uses: actions/checkout@v4
        with:
          # When called from release.yml, the release job bumps the version
          # and pushes a new tag during this same run. A reusable workflow
          # otherwise checks out the commit that *triggered* the run, which
          # is the pre-bump SHA, so the build would produce the previous
          # version and fail to upload (file already exists).
          ref: ${{ inputs.version && format('v{0}', inputs.version) || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Build distributions
        run: python -m build

      - name: Verify distributions
        run: twine check dist/*

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
